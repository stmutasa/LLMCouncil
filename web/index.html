<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>LLM Council</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none'%3E%3Ccircle cx='12' cy='12' r='4.25' stroke='%23555' stroke-width='1.75'/%3E%3Ccircle cx='12' cy='3.5' r='1.75' fill='%23555'/%3E%3Ccircle cx='4.64' cy='16.25' r='1.75' fill='%23555'/%3E%3Ccircle cx='19.36' cy='16.25' r='1.75' fill='%23555'/%3E%3C/svg%3E"
    />
    <script>
      // Apply the saved theme before the first paint so the page does not flash.
      (function () {
        var pref = 'system';
        try {
          pref = window.localStorage.getItem('llm-council.theme') || 'system';
        } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
